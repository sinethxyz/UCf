name: Public release audit

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: public-release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app foundry workers
      - name: Lint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          ruff check . > /tmp/ruff.txt 2>&1
          code=$?
          cat /tmp/ruff.txt
          description=$(python - <<'PY'
          from pathlib import Path
          lines = [line.strip() for line in Path("/tmp/ruff.txt").read_text().splitlines() if line.strip()]
          print((lines[0] if lines else "Ruff passed")[:120])
          PY
          )
          state=success
          if [ "$code" -ne 0 ]; then state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state="$state" -f context="audit/ruff" -f description="$description" >/dev/null
          exit "$code"
      - name: Tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee /tmp/pytest.txt
          code=${PIPESTATUS[0]}
          description=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/pytest.txt").read_text()
          matches = re.findall(r"([0-9]+ passed(?:, [^\n]+)? in [0-9.]+s)", text)
          if matches:
              print(matches[-1][:120])
          else:
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              print((lines[-1] if lines else "pytest produced no summary")[:120])
          PY
          )
          state=success
          if [ "$code" -ne 0 ]; then state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state="$state" -f context="audit/pytest" -f description="$description" >/dev/null
          exit "$code"

  history-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full reachable history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  historical-archive-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect reachable historical archives without printing contents
        shell: bash
        run: |
          python - <<'PY'
          import io
          import re
          import subprocess
          import sys
          import zipfile

          archive_suffixes = (".zip", ".tar", ".tgz", ".tar.gz", ".gz", ".7z")
          object_lines = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"], text=True
          ).splitlines()

          archives = []
          for line in object_lines:
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  continue
              oid, path = parts
              if path.lower().endswith(archive_suffixes):
                  archives.append((oid, path))

          print(f"reachable historical archives: {len(archives)}")
          for _, path in archives:
              print(f"- {path}")

          signatures = {
              "private-key": re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "github-token": re.compile(rb"(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,})"),
              "anthropic-key": re.compile(rb"sk-ant-[A-Za-z0-9_-]{20,}"),
              "aws-access-key": re.compile(rb"AKIA[0-9A-Z]{16}"),
          }

          findings = []
          inspected_members = 0
          for oid, path in archives:
              blob = subprocess.check_output(["git", "cat-file", "-p", oid])
              if path.lower().endswith(".zip"):
                  try:
                      with zipfile.ZipFile(io.BytesIO(blob)) as zf:
                          for member in zf.infolist():
                              if member.is_dir():
                                  continue
                              inspected_members += 1
                              try:
                                  data = zf.read(member)
                              except Exception:
                                  continue
                              for rule, pattern in signatures.items():
                                  if pattern.search(data):
                                      findings.append((path, member.filename, rule))
                  except zipfile.BadZipFile:
                      findings.append((path, "<archive>", "invalid-zip"))

          print(f"historical zip members inspected: {inspected_members}")
          if findings:
              print("high-confidence archive findings (values redacted):")
              for archive, member, rule in findings:
                  print(f"- {archive} :: {member} :: {rule}")
              sys.exit(1)

          print("no high-confidence credential signatures found inside reachable ZIP archives")
          PY
